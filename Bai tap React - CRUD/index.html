<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng - React CRUD (IT4409)</title>
    <!-- Thêm các thư viện React, ReactDOM và Babel qua CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Top navigation bar */
        .top-nav {
            background: #1e3a5f;
            color: #ffffff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        .top-nav .brand {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.3px;
        }

        .top-nav a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.12);
            transition: background 0.2s ease;
        }

        .top-nav a:hover {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }

        /* Main container */
        .app-container {
            max-width: 1180px;
            margin: 28px auto;
            padding: 28px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
        }

        .app-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
        }

        .app-header h1 {
            font-size: 26px;
            color: #0f172a;
            font-weight: 700;
        }

        .app-subtitle {
            font-size: 14px;
            color: #64748b;
        }

        /* Toolbar: SearchForm + AddUser button */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            max-width: 420px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Buttons */
        button {
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            padding: 10px 18px;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-edit {
            background: #f59e0b;
            color: #ffffff;
            padding: 6px 12px;
            font-size: 13px;
            margin-right: 6px;
        }

        .btn-edit:hover {
            background: #d97706;
        }

        .btn-delete {
            background: #ef4444;
            color: #ffffff;
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        /* Table styling */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        thead {
            background: #1e3a5f;
            color: #ffffff;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        th {
            font-weight: 600;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        tbody tr:hover {
            background: #eff6ff;
        }

        .badge-id {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
        }

        .actions-cell {
            white-space: nowrap;
        }

        .status-box {
            padding: 28px;
            text-align: center;
            color: #64748b;
            font-size: 15px;
        }

        .table-meta {
            margin-top: 12px;
            font-size: 13px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* Modal Overlay & Content (Bước 8) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
        }

        .modal-content {
            background: #ffffff;
            padding: 22px 24px;
            border-radius: 10px;
            width: 100%;
            max-width: 440px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
        }

        .modal-content h4 {
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .form-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin: 14px 0 8px;
            letter-spacing: 0.4px;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
        }

        @media (max-width: 600px) {
            .app-container {
                margin: 12px;
                padding: 16px;
            }

            .form-row-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <span class="brand">IT4409 - Bài tập React CRUD</span>
        <a href="../index.html">&larr; Quay lại Trang chủ</a>
    </nav>

    <div id="root"></div>

    <script type="text/babel">
        // ============================================================
        // BƯỚC 3: COMPONENT SEARCHFORM
        // Nhận prop onChangeValue (hàm setKeyword từ App)
        // ============================================================
        function SearchForm({ onChangeValue }) {
            return (
                <div className="search-box">
                    <input
                        className="search-input"
                        type="text"
                        placeholder="Tìm theo name, username"
                        onChange={(e) => onChangeValue(e.target.value)}
                    />
                </div>
            );
        }

        // ============================================================
        // BƯỚC 5: COMPONENT ADDUSER
        // Quản lý form thêm người dùng mới và xử lý object lồng (address)
        // ============================================================
        function AddUser({ onAdd }) {
            const emptyUser = {
                name: "",
                username: "",
                email: "",
                address: { street: "", suite: "", city: "" },
                phone: "",
                website: ""
            };

            const [adding, setAdding] = React.useState(false);
            const [user, setUser] = React.useState(emptyUser);

            const handleChange = (e) => {
                const { id, value } = e.target;
                if (["street", "suite", "city"].includes(id)) {
                    setUser({
                        ...user,
                        address: { ...user.address, [id]: value }
                    });
                } else {
                    setUser({ ...user, [id]: value });
                }
            };

            const handleAdd = () => {
                if (user.name.trim() === "" || user.username.trim() === "") {
                    alert("Vui lòng nhập Name và Username!");
                    return;
                }
                onAdd(user);
                setUser(emptyUser);
                setAdding(false);
            };

            const handleCancel = () => {
                setUser(emptyUser);
                setAdding(false);
            };

            return (
                <div>
                    <button className="btn-primary" onClick={() => setAdding(true)}>
                        + Thêm người dùng
                    </button>

                    {adding && (
                        <div className="modal-overlay">
                            <div className="modal-content">
                                <h4>Thêm người dùng mới</h4>

                                <div className="form-group">
                                    <label htmlFor="name">Name *</label>
                                    <input
                                        id="name"
                                        type="text"
                                        placeholder="Nhập họ tên"
                                        value={user.name}
                                        onChange={handleChange}
                                    />
                                </div>

                                <div className="form-group">
                                    <label htmlFor="username">Username *</label>
                                    <input
                                        id="username"
                                        type="text"
                                        placeholder="Nhập tên đăng nhập"
                                        value={user.username}
                                        onChange={handleChange}
                                    />
                                </div>

                                <div className="form-group">
                                    <label htmlFor="email">Email</label>
                                    <input
                                        id="email"
                                        type="email"
                                        placeholder="example@email.com"
                                        value={user.email}
                                        onChange={handleChange}
                                    />
                                </div>

                                <div className="form-row-2">
                                    <div className="form-group">
                                        <label htmlFor="phone">Phone</label>
                                        <input
                                            id="phone"
                                            type="text"
                                            placeholder="Số điện thoại"
                                            value={user.phone}
                                            onChange={handleChange}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label htmlFor="website">Website</label>
                                        <input
                                            id="website"
                                            type="text"
                                            placeholder="example.org"
                                            value={user.website}
                                            onChange={handleChange}
                                        />
                                    </div>
                                </div>

                                <div className="form-section-title">Địa chỉ (Address)</div>

                                <div className="form-group">
                                    <label htmlFor="street">Street</label>
                                    <input
                                        id="street"
                                        type="text"
                                        placeholder="Tên đường"
                                        value={user.address.street}
                                        onChange={handleChange}
                                    />
                                </div>

                                <div className="form-row-2">
                                    <div className="form-group">
                                        <label htmlFor="suite">Suite</label>
                                        <input
                                            id="suite"
                                            type="text"
                                            placeholder="Số phòng / căn hộ"
                                            value={user.address.suite}
                                            onChange={handleChange}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label htmlFor="city">City</label>
                                        <input
                                            id="city"
                                            type="text"
                                            placeholder="Thành phố"
                                            value={user.address.city}
                                            onChange={handleChange}
                                        />
                                    </div>
                                </div>

                                <div className="modal-actions">
                                    <button className="btn-secondary" onClick={handleCancel}>
                                        Hủy
                                    </button>
                                    <button className="btn-primary" onClick={handleAdd}>
                                        Thêm
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ============================================================
        // BƯỚC 4, 6, 7: COMPONENT RESULTTABLE
        // Tải API, lọc theo keyword, thêm user mới, sửa (Deep Copy), xóa
        // ============================================================
        function ResultTable({ keyword, user, onAdded }) {
            const [users, setUsers] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [error, setError] = React.useState(null);
            const [editing, setEditing] = React.useState(null);

            // Tải dữ liệu 1 lần khi component mount
            React.useEffect(() => {
                fetch("https://jsonplaceholder.typicode.com/users")
                    .then((res) => {
                        if (!res.ok) {
                            throw new Error("Không thể tải danh sách người dùng từ API.");
                        }
                        return res.json();
                    })
                    .then((data) => {
                        setUsers(data);
                        setLoading(false);
                    })
                    .catch((err) => {
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            // Lắng nghe prop user mới từ App để thêm vào danh sách
            React.useEffect(() => {
                if (user) {
                    setUsers((prev) => {
                        const nextId = prev.length > 0
                            ? Math.max(...prev.map((u) => u.id)) + 1
                            : 1;
                        return [...prev, { ...user, id: nextId }];
                    });
                    onAdded();
                }
            }, [user]);

            // Lọc danh sách theo keyword (name hoặc username)
            const filteredUsers = users.filter((u) => {
                const lowerKw = keyword.toLowerCase();
                return (
                    (u.name || "").toLowerCase().includes(lowerKw) ||
                    (u.username || "").toLowerCase().includes(lowerKw)
                );
            });

            // Bước 6: Deep Copy đối tượng user và address sang state editing
            function editUser(targetUser) {
                setEditing({
                    ...targetUser,
                    address: { ...(targetUser.address || { street: "", suite: "", city: "" }) }
                });
            }

            function handleEditChange(field, value) {
                if (["street", "suite", "city"].includes(field)) {
                    setEditing((prev) => ({
                        ...prev,
                        address: { ...prev.address, [field]: value }
                    }));
                } else {
                    setEditing((prev) => ({ ...prev, [field]: value }));
                }
            }

            function saveUser() {
                if (!editing.name.trim() || !editing.username.trim()) {
                    alert("Vui lòng không để trống Name và Username!");
                    return;
                }
                setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
                setEditing(null);
            }

            // Bước 7: Xóa người dùng không làm biến đổi trực tiếp state cũ
            function removeUser(id) {
                setUsers((prev) => prev.filter((u) => u.id !== id));
            }

            if (loading) {
                return <div className="status-box">Đang tải danh sách người dùng...</div>;
            }

            if (error) {
                return <div className="status-box" style={{ color: "#dc2626" }}>Lỗi: {error}</div>;
            }

            return (
                <div>
                    <div className="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Họ tên</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Địa chỉ</th>
                                    <th>Số điện thoại</th>
                                    <th>Website</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filteredUsers.length === 0 ? (
                                    <tr>
                                        <td colSpan="8" className="status-box">
                                            Không tìm thấy người dùng nào phù hợp với từ khóa "{keyword}".
                                        </td>
                                    </tr>
                                ) : (
                                    filteredUsers.map((u) => (
                                        <tr key={u.id}>
                                            <td><span className="badge-id">#{u.id}</span></td>
                                            <td><strong>{u.name}</strong></td>
                                            <td>{u.username}</td>
                                            <td>{u.email}</td>
                                            <td>
                                                {[u.address?.street, u.address?.suite, u.address?.city]
                                                    .filter(Boolean)
                                                    .join(", ")}
                                            </td>
                                            <td>{u.phone}</td>
                                            <td>{u.website}</td>
                                            <td className="actions-cell">
                                                <button className="btn-edit" onClick={() => editUser(u)}>
                                                    Sửa
                                                </button>
                                                <button className="btn-delete" onClick={() => removeUser(u.id)}>
                                                    Xóa
                                                </button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    <div className="table-meta">
                        <span>Hiển thị {filteredUsers.length} / {users.length} người dùng</span>
                        {keyword && <span>Đang lọc theo từ khóa: <strong>"{keyword}"</strong></span>}
                    </div>

                    {editing && (
                        <div className="modal-overlay">
                            <div className="modal-content">
                                <h4>Chỉnh sửa người dùng (#{editing.id})</h4>

                                <div className="form-group">
                                    <label htmlFor="edit-name">Name *</label>
                                    <input
                                        id="edit-name"
                                        type="text"
                                        value={editing.name || ""}
                                        onChange={(e) => handleEditChange("name", e.target.value)}
                                    />
                                </div>

                                <div className="form-group">
                                    <label htmlFor="edit-username">Username *</label>
                                    <input
                                        id="edit-username"
                                        type="text"
                                        value={editing.username || ""}
                                        onChange={(e) => handleEditChange("username", e.target.value)}
                                    />
                                </div>

                                <div className="form-group">
                                    <label htmlFor="edit-email">Email</label>
                                    <input
                                        id="edit-email"
                                        type="email"
                                        value={editing.email || ""}
                                        onChange={(e) => handleEditChange("email", e.target.value)}
                                    />
                                </div>

                                <div className="form-row-2">
                                    <div className="form-group">
                                        <label htmlFor="edit-phone">Phone</label>
                                        <input
                                            id="edit-phone"
                                            type="text"
                                            value={editing.phone || ""}
                                            onChange={(e) => handleEditChange("phone", e.target.value)}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label htmlFor="edit-website">Website</label>
                                        <input
                                            id="edit-website"
                                            type="text"
                                            value={editing.website || ""}
                                            onChange={(e) => handleEditChange("website", e.target.value)}
                                        />
                                    </div>
                                </div>

                                <div className="form-section-title">Địa chỉ (Address)</div>

                                <div className="form-group">
                                    <label htmlFor="edit-street">Street</label>
                                    <input
                                        id="edit-street"
                                        type="text"
                                        value={editing.address?.street || ""}
                                        onChange={(e) => handleEditChange("street", e.target.value)}
                                    />
                                </div>

                                <div className="form-row-2">
                                    <div className="form-group">
                                        <label htmlFor="edit-suite">Suite</label>
                                        <input
                                            id="edit-suite"
                                            type="text"
                                            value={editing.address?.suite || ""}
                                            onChange={(e) => handleEditChange("suite", e.target.value)}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label htmlFor="edit-city">City</label>
                                        <input
                                            id="edit-city"
                                            type="text"
                                            value={editing.address?.city || ""}
                                            onChange={(e) => handleEditChange("city", e.target.value)}
                                        />
                                    </div>
                                </div>

                                <div className="modal-actions">
                                    <button className="btn-secondary" onClick={() => setEditing(null)}>
                                        Hủy
                                    </button>
                                    <button className="btn-primary" onClick={saveUser}>
                                        Lưu thay đổi
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ============================================================
        // BƯỚC 2: COMPONENT GỐC APP (STATE LIFTING)
        // Quản lý toàn bộ state dùng chung (kw, newUser) và truyền props xuống con
        // ============================================================
        function App() {
            const [kw, setKeyword] = React.useState("");
            const [newUser, setNewUser] = React.useState(null);

            return (
                <div className="app-container">
                    <div className="app-header">
                        <div>
                            <h1>Quản lý người dùng</h1>
                            <p className="app-subtitle">
                                Ứng dụng React CRUD (Create, Read, Update, Delete) với State Lifting &amp; Hooks
                            </p>
                        </div>
                    </div>

                    <div className="toolbar">
                        <SearchForm onChangeValue={setKeyword} />
                        <AddUser onAdd={setNewUser} />
                    </div>

                    <ResultTable
                        keyword={kw}
                        user={newUser}
                        onAdded={() => setNewUser(null)}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
